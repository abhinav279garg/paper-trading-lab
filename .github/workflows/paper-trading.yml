name: Paper trading (simulated)

on:
  schedule:
    - cron: "17 22 * * *"   # once a day, after the US market close
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["lab/**", "tests/**", "requirements.txt", ".github/workflows/**"]

permissions:
  contents: write

concurrency:
  group: paper-trading
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - run: python -m lab.run
      - name: Commit updated results
        run: |
          git config user.name "paper-trading-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md results charts data
          git diff --cached --quiet || git commit -m "Daily paper-trading update [skip ci]"
          git pull --rebase origin main
          git push
