name: Event experiment (research, paper only)

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["event_lab/**"]

permissions:
  contents: write

concurrency:
  group: event-lab
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
    steps:
      - uses: actions/checkout@v4
      - name: Check whether there is anything to do
        id: check
        run: |
          if [ -z "$SEC_CONTACT" ]; then echo "The SEC_CONTACT secret is not set yet."; echo "go=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          if grep -q '"final": true' results/event_lab/STATUS.json 2>/dev/null; then echo "Already finished."; echo "go=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "go=yes" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.check.outputs.go == 'yes'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.check.outputs.go == 'yes'
        run: pip install -r requirements.txt pytest
      - if: steps.check.outputs.go == 'yes'
        run: python -m pytest -q tests/test_event_lab.py
      - if: steps.check.outputs.go == 'yes'
        run: python -m event_lab.run
      - name: Commit results
        if: steps.check.outputs.go == 'yes' && always()
        run: |
          git config user.name "event-lab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/event_lab
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Event experiment progress [skip ci]"
          git stash -u || true
          git pull --rebase origin main
          git push
